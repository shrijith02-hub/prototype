<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #2F5BEA; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">CX</div>
<div style="display: flex; flex-direction: column">
<span style="font-weight: 800; font-size: 17px; color: #111827">CampusX</span>
<span style="font-size: 12px; font-weight: 600; color: #5B6475">Staff Portal</span>
</div>
</div>
<nav style="display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px">
<h3 style="margin: 0 0 6px; padding: 0 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6475">{{g.title}}</h3>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: {{n.bg}}; color: {{n.color}}; font-size: 14px; font-weight: 600; text-align: left; text-decoration: none; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</div>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"int","default":0,"min":0,"max":14},"$preview":{"width":300,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const active = parseInt(this.props.active ?? 0, 10) || 0;
const names = [
['Staff Dashboard','M3 3h8v8H3z M13 3h8v5h-8z M13 10h8v11h-8z M3 13h8v8H3z'],
['Attendance Management','M4 5h16v15H4z M4 9h16 M8 3v4 M16 3v4 M9 14l2 2 4-4'],
['Academic Management','M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z M4 19V5'],
['Student Management','M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20c0-3 3-5 6-5s6 2 6 5 M17 6a3 3 0 0 1 0 5 M18 15c2 .5 3 2 3 5'],
['Examination & Results','M6 3h9l4 4v14H6z M14 3v5h5 M9 14l2 2 4-4'],
['Homework & Assignments','M4 20l1-5L16 4l4 4L9 19z M14 6l4 4'],
['Communication Centre','M4 5h16v11H9l-5 4z'],
['Task Management','M9 6h11 M9 12h11 M9 18h11 M4 6l1 1 2-2 M4 12l1 1 2-2 M4 18l1 1 2-2'],
['Leave & Permission','M3 12h14 M12 6l6 6-6 6 M20 4v16'],
['Staff Development Hub','M3 17l6-6 4 4 8-8 M15 7h6v6'],
['Resources & Library','M4 4h4v16H4z M10 4h4v16h-4z M16 6l4 1-3 13-4-1z'],
['Payroll & Benefits','M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l3-3h11 M16 14h3'],
['Events & Activities','M5 21V4 M5 4h12l-2 4 2 4H5'],
['Staff Support Centre','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
['Profile & Settings','M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4']
];
const files = ['Main', 'Attendance', 'Academic', 'Students', 'Exams', 'Homework', 'Communication', 'Tasks', 'Leave', 'Development', 'Resources', 'Payroll', 'Events', 'Support', 'Profile'].map((f) => f + '.dc.html');
return {
groups: [
{ title: 'Main', ids: [0, 1, 8] },
{ title: 'Teaching', ids: [2, 3, 4, 5] },
{ title: 'Work & Communication', ids: [6, 7, 12] },
{ title: 'Growth & Resources', ids: [9, 10] },
{ title: 'Admin & Support', ids: [11, 13, 14] }
].map((g) => ({
title: g.title,
items: g.ids.map((i) => ({
label: names[i][0],
d: names[i][1],
href: files[i],
bg: i === active ? '#EAF0FF' : 'transparent',
color: i === active ? '#1D3FB8' : '#3B4558'
}))
}))
};
}
}
</script>
</body>
</html>
